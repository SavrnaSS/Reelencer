name = "gig-inbox-email-worker"
main = "cloudflare/email-worker.ts"
compatibility_date = "2026-02-04"

[vars]
# Set these for local testing via wrangler; production should use secrets.
GIG_INGEST_URL = "https://reelencer.com/api/gig-inbox/ingest"
SOCIAL_SYNC_URL = "https://reelencer.com/api/jobs/social-sync"
WORKER_PURGE_URL = "https://reelencer.com/api/jobs/worker-purge"

[triggers]
crons = ["* * * * *"]
